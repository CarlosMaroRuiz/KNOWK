<level-layout [levels]="levels" [(selectLevel)]="selectLevel" [subtitle]="subtitle" [title]="title">

  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-label">Total:</span>

      <span class="stat-value">{{ words().length }}</span>
    </div>
    <div class="stat-item stat-success">
      <span class="stat-label">Aprendidas:</span>
      <span class="stat-value">{{ learnedCount() }}</span>
    </div>
    <div class="stat-item stat-danger">
      <span class="stat-label">Por Repasar:</span>
      <span class="stat-value">{{ reviewCount() }}</span>
    </div>
  </div>


  @if (wordsResource.isLoading()) {
  <div class="skeleton-grid">
    <app-skeleton shape="card" height="280px" />
    <app-skeleton shape="card" height="280px" />
    <app-skeleton shape="card" height="280px" />
  </div>
  } @else if (wordsResource.error()) {
  <app-error-state title="Error al cargar el vocabulario"
    message="No se pudieron obtener las palabras del nivel seleccionado." (retry)="retryFetch()" />
  } @else if (words().length > 0) {
  <div class="cards-grid">
    @for (word of words(); track word.id) {
    <app-vocabulary-card [word]="word" [isFlipped]="!!flippedCards()[word.id]" [status]="wordStatus()[word.id]"
      (toggleFlip)="toggleFlip(word.id)" (markStatus)="setStatus(word.id, $event)" />
    }
  </div>
  } @else {
  <div class="empty-box">
    <p>No hay palabras disponibles para este nivel.</p>
  </div>
  }

</level-layout>
