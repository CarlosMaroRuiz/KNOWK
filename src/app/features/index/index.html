<index-layout>
    <index-header-baner />

       @for (area of areas(); track area.id) {
      <index-area-section
        [id]="area.id"
        [name]="area.name"
        [description]="area.description"
        [icon]="area.icon"
        [itemCount]="area.items.length"
      >
        @for (item of area.items; track item.id) {
          <catalog-card [item]="item" />
        }
      </index-area-section>
    }
</index-layout>
