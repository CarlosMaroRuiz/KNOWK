<level-layout [levels]="levels" [(selectLevel)]="selectLevel" [subtitle]="subtitle" [title]="title">
  @if (topicsResource.isLoading()) {
    <div class="skeleton-grid">
      <app-skeleton shape="card" height="200px" />
      <app-skeleton shape="card" height="200px" />
    </div>
  } @else if (topicsResource.error()) {
    <app-error-state
      title="Error al cargar las lecciones"
      message="No se pudieron obtener las reglas gramaticales para el nivel seleccionado."
      (retry)="retryFetch()"
    />
  } @else if (viewMode() === 'catalog') {
    <div class="topics-grid">
      @for (topic of topics(); track topic.id) {
        <app-grammar-topic-card [topic]="topic" (selectTopic)="selectTopic($event)" />
      } @empty {
        <div class="empty-box">
          <p>No hay lecciones disponibles para este nivel.</p>
        </div>
      }
    </div>
  } @else if (viewMode() === 'lesson' && selectedTopic(); as topic) {
    <app-lesson-container 
      [topic]="topic" 
      (backToCatalog)="backToCatalog()" 
    />
  }
</level-layout>
